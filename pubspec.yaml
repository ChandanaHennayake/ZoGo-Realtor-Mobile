name: zogo_realtor
description: "ZoGo Realtor - Find. Buy. Live."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # API / Networking
  http: ^1.6.0

  # Secure storage for JWT access & refresh tokens
  flutter_secure_storage: ^11.0.0

  # Application navigation
  go_router: ^17.5.0

  # Native Android/iOS launch splash
  flutter_native_splash: ^2.4.8
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Generate Android/iOS app icons
  flutter_launcher_icons: ^0.14.4

# ---------------------------------------------------------
# Flutter
# ---------------------------------------------------------

flutter:
  uses-material-design: true

  # ZoGo application assets
  assets:
    - assets/images/

# ---------------------------------------------------------
# ZoGo App Icon
# ---------------------------------------------------------

flutter_launcher_icons:
  android: true
  ios: true

  image_path: "assets/images/zogo_app_icon.png"

# ---------------------------------------------------------
# ZoGo Native Launch Splash
# ---------------------------------------------------------

flutter_native_splash:
  color: "#FFFFFF"

  image: "assets/images/zogo_native_logo.png"

  android: true
  ios: true
  web: false

  android_12:
    color: "#FFFFFF"
    image: "assets/images/zogo_native_logo.png"
    icon_background_color: "#FFFFFF"